<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mechanics Studio</title><link rel="stylesheet" href="./studio.css">
<body data-view="start">
<header>
 <button id="projects" class="ghost" title="Projekte, neue Projekte und Beispiele">☰ Projekte</button>
 <b id="project-name"></b><span id="save-state" class="muted" role="status"></span>
 <nav id="phases" aria-label="Phasen"><button data-phase="1">① Aufbauen</button><button data-phase="2">② Bewegen</button><button data-phase="3">③ Fertigen</button></nav>
 <span class="spacer"></span>
 <button id="undo" class="ghost" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button><button id="redo" class="ghost" title="Wiederholen (Strg+Shift+Z)" aria-label="Wiederholen">↷</button>
 <details id="menu"><summary class="ghost" aria-label="Weitere Aktionen">⋯</summary><div class="menu-items"><button id="project-rename">Projekt umbenennen</button><button id="export">Als Datei exportieren</button><button id="import">Datei importieren</button><button id="project-delete" class="danger">Projekt löschen</button></div></details>
 <input id="import-file" type="file" accept=".json,application/json" hidden>
</header>
<section id="start"></section>
<main id="project">
 <aside id="left">
  <section id="library-box"><h2 id="library-title">Bibliothek</h2><div id="library"></div></section>
  <section id="scene-box"><h2>Szene</h2><div id="tree"></div></section>
 </aside>
 <section id="workspace">
  <div id="view"><div id="gizmo-tools" hidden><button id="move" aria-pressed="true" title="Verschieben">✥ Verschieben</button><button id="rotate" title="Drehen">⟳ Drehen</button></div><button id="fit" title="Alles einpassen">⤢ Einpassen</button><div id="view-hint"></div></div>
  <div id="axes-bar">
   <div id="axes"></div>
   <details id="motion-panel"><summary>Bewegung über den ganzen Bereich</summary><div class="panel-title"><button id="motion-run">Berechnen</button><button id="motion-play" disabled aria-label="Abspielen">▶</button><input id="motion-pose" type="range" min="0" max="0" value="0" disabled aria-label="Stellung"><span id="motion-label" class="muted"></span><button id="motion-close" disabled>Schließen</button></div><div id="motion-body"><div id="motion-chart"></div><p id="motion-report" class="muted" role="status">Keine Bewegung berechnet.</p></div></details>
  </div>
 </section>
 <aside id="right"><section id="properties-box"><div id="properties"></div></section><section id="todo-box"><h2>Was fehlt noch</h2><ol id="todo"></ol></section></aside>
</main>
<footer id="status" role="status">Bereit</footer>
<script src="./studio.js"></script></body></html>
